<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>
  <link rel="stylesheet" href="game/game.css">
</head>
<body>
  <img id="audio" src="game/audio.png">

  <template id="P1">
    <link rel="stylesheet" href="game/P1.css">
    <img src="./game/P1.png">
  </template>
  <template id="P2">
    <link rel="stylesheet" href="game/P2.css">
    <img src="./game/P2.png">
  </template>
  <template id="P3">
    <link rel="stylesheet" href="game/P3.css">
    <img src="./game/P3.png">
  </template>

  <span id="matchInfo">
    <div id="game"></div>
    <div id="category"></div>
  </span>
  
  <span id="timerContainer">
    <span style="flex: 1"></span>
    <span id="remainingTime">
      <span id="remainingTimeDigit0"></span>
      <span id="remainingTimeDigit1"></span>
      <span id="remainingTimeDigit2"></span>
      <span id="remainingTimeDigit3"></span>
      <span id="remainingTimeDigit4"></span>
      <span id="remainingTimeDigit5"></span>
    </span>
    <span id="finalRun">FINAL RUN!</span>
    <span style="flex: 1" id="resetTimeText">
    </span>
  </span>

  <template id="plate">
    <div class="plate">
      <span class="plateTop"></span>
      <span class="plateMiddle"></span>
      <span class="plateBottom"></span>
    </div>
  </template>
  
  <span id="results">
    <span id="resultsInner"></span>
  </span>
  <script type="module" src="game/game.ts"></script>
</body>
</html>
