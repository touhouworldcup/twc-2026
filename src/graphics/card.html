<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Card</title>
  <link rel="stylesheet" href="card/card.css">
</head>
<body>
  <img class="fullscreen" src="card/gradient-layer.png">
  <img class="fullscreen color-multiply image-shadow" src="card/color-layer.png">
  <img class="fullscreen color-multiply" src="card/color-layer-2.png">
  <img class="fullscreen image-shadow" src="card/static-layer.png">
  <img class="fullscreen" src="card/static-layer-2.png">
  
  <div id="matchInfo">
    <div id="game"></div>
    <div id="category"></div>
  </div>

  <template id="player">
    <div class="name"></div>
    <div class="team"></div>
  </template>
  <div id="outerPlayersContainer">
    <div id="playersContainer">
    </div>
  </div>

  <div id="timeContainer">
    <div id="time">
      <span id="timer0" class="digit"></span>
      <span id="timer1" class="digit"></span>
      <span id="timer2" class="colon"></span>
      <span id="timer3" class="digit"></span>
      <span id="timer4" class="digit"></span>
    </div>
    <div id="time-nextmatch">
      <div id="day"></div>
      <div id="timezone"></div>
    </div>
  </div>

  <script type="module" src="card/card.ts"></script>
</body>
</html>
